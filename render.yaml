services:
  # 1. The AI Analyzer (Python)
  - type: web
    name: infrasight-ai
    env: python
    rootDir: ai-analyzer
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 1 -t 300
    envVars:
      - key: ANALYZER_PORT
        value: 10000

  # 2. The Backend (Node.js)
  - type: web
    name: infrasight-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANALYZER_URL
        sync: false   # Set this in Render Dashboard to your AI analyzer public URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: AI_API_KEY
        sync: false

  # 3. The Frontend (Static Site)
  - type: web
    name: infrasight
    env: static
    rootDir: frontend
    buildCommand: npm install --include=dev && chmod +x node_modules/.bin/vite && node_modules/.bin/vite build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
