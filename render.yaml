services:
  # 1. AI Analyzer (Python)
  - type: web
  name: infrasight-ai
  env: python
  rootDir: ai-analyzer
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: gunicorn app:app
  envVars:
    - key: ANALYZER_PORT
      value: 10000 # Render's default port

  # 2. Backend (Node.js)
  - type: web
  name: infrasight-backend
  env: node
  rootDir: backend
  plan: free
  buildCommand: npm install
  startCommand: npm start
  envVars:
    - key: ANALYZER_URL
      value: http://infrasight-ai:10000   # ← use internal DNS, no Cloudflare
    - key: SUPABASE_URL
      sync: false
    - key: SUPABASE_KEY
      sync: false
    - key: AI_API_KEY
      sync: false
    - key: REDIS_URL         # <-- new env var, will be populated automatically
        sync: false

  # 3. Frontend (Static site)
  - type: web
    name: infrasight
    env: static
    rootDir: frontend
    buildCommand: npm install --include=dev && chmod +x node_modules/.bin/vite && node_modules/.bin/vite build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_URL
        sync: false   # set in Render UI, not in the file
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: infrasight-queue
    env: python
    rootDir: queue-worker          # <-- path we will create
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: REDIS_URL            # receives the same value as backend
        sync: false
      - key: ANALYZER_URL         # worker needs to call the AI analyzer
        sync: false
      - key: AI_API_KEY           # for Groq
        sync: false
